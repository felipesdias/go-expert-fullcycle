version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - IP_REQUESTS_PER_SECOND=5
      - IP_BLOCK_DURATION_SECONDS=300
      - TOKEN_LIMITS=token1:20,token2:50
      - TOKEN_BLOCK_DURATION_SECONDS=600
    depends_on:
      - redis

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"